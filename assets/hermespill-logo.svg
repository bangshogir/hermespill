<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="HermesPill">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="#0b0b12"/>
  <!-- the pill / notch -->
  <rect x="48" y="96" width="160" height="64" rx="32" fill="url(#g)" filter="url(#glow)"/>
  <!-- agent "eye" / sensor -->
  <circle cx="96" cy="128" r="10" fill="#0b0b12"/>
  <!-- signal bars -->
  <rect x="130" y="120" width="7" height="16" rx="3" fill="#0b0b12"/>
  <rect x="144" y="112" width="7" height="24" rx="3" fill="#0b0b12"/>
  <rect x="158" y="122" width="7" height="14" rx="3" fill="#0b0b12"/>
</svg>
